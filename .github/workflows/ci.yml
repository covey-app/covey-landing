name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design tokens check
        run: npm run tokens:check
      - name: Waitlist handler unit tests
        run: npm run test:unit
      - name: Waitlist migration tests (throwaway Postgres)
        run: npm run test:db
      - name: Type + content check
        run: npm run check
      - name: Production build (live content)
        run: npm run build

