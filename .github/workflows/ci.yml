name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails if src/styles/tokens.css is stale vs the committed tokens.json.
      # (The cross-repo drift check against covey-web's theme is local-only:
      # `npm run tokens:verify` with a covey-web checkout.)
      - run: npm run tokens:check
      - run: npm run build
